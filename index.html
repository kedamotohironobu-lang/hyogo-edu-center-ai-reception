<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="description" content="兵庫県立総合教育センター 一般AI音声受付案内">
  <title>兵庫県立総合教育センター AI音声受付案内</title>

  <style>
    :root {
      color-scheme: light;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Meiryo,
        sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #17324d;
      background:
        radial-gradient(circle at top, #eef8ff 0, transparent 48%),
        linear-gradient(160deg, #f8fbff 0%, #e8f4ff 100%);
    }

    main {
      width: min(100%, 680px);
      padding: 32px 24px;
      text-align: center;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid #d7e8f5;
      border-radius: 24px;
      box-shadow: 0 16px 44px rgba(25, 75, 115, 0.12);
    }

    .status {
      display: inline-block;
      margin-bottom: 20px;
      padding: 7px 14px;
      color: #12613b;
      background: #e7f8ef;
      border-radius: 999px;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      line-height: 1.4;
    }

    p {
      margin: 10px 0;
      font-size: 1.05rem;
      line-height: 1.8;
    }

    .notice {
      margin-top: 24px;
      padding: 18px;
      text-align: left;
      background: #f4f9fd;
      border-radius: 16px;
    }
  </style>
</head>

<body>
  <main>
    <div class="status">基盤分離確認用ページ</div>

    <h1>兵庫県立総合教育センター<br>AI音声受付案内</h1>

    <p>一般受付版の公開準備ができました。</p>
    <p>現在、音声受付機能を構築しています。</p>

    <div class="notice">
      このページは公開講座受付とは別に構築した、
      一般的なお問い合わせのための受付システムです。
    </div>
  </main>
</body>
</html>
